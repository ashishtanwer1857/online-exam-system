{% extends "base.html" %}

{% block title %}{{ exam.title }}{% endblock %}

{% block content %}
<h2>{{ exam.title }}</h2>
<p>{{ exam.description }}</p>

<form method="POST" action="{{ url_for('submit_exam', exam_id=exam.id) }}">
  <ol>
    {% for q in questions %}
      <li>
        <p>{{ q.question_text }}</p>

        <label>
          <input type="radio" name="question_{{ q.id }}" value="A" required>
          A. {{ q.option_a }}
        </label><br>

        <label>
          <input type="radio" name="question_{{ q.id }}" value="B">
          B. {{ q.option_b }}
        </label><br>

        <label>
          <input type="radio" name="question_{{ q.id }}" value="C">
          C. {{ q.option_c }}
        </label><br>

        <label>
          <input type="radio" name="question_{{ q.id }}" value="D">
          D. {{ q.option_d }}
        </label><br>
      </li>
      <hr>
    {% endfor %}
  </ol>

  <button type="submit">Submit Exam</button>
</form>

<a href="{{ url_for('dashboard') }}">Cancel</a>
{% endblock %}
